spring.application.name=partitadiCalcio


# ==========================================================================
# CONFIGURAZIONE DATABASE (PostgreSQL)
# ==========================================================================
# URL del database locale. Sostituisci "nome_del_tuo_db" con il nome reale del tuo DB su PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/Partita.sql
spring.datasource.username=postgres
spring.datasource.password=tua_password

# Driver JDBC per PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================================================
# CONFIGURAZIONE JPA / HIBERNATE
# ==========================================================================
# Permette a Hibernate di creare/aggiornare le tabelle automaticamente partendo dalle classi Java (Entità)
spring.jpa.hibernate.ddl-auto=update

# Mostra nella console di Spring Boot le query SQL effettive che vengono eseguite (utilissimo per il Punto 8.2!)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Specifica il dialetto corretto per PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect